kind = "web"
previewPath = "/"
title = "FiberPay Wallet"
version = "1.0.0"
id = "artifacts/fiberpay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19816

[services.development]
run = "pnpm --filter @workspace/fiberpay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fiberpay", "run", "build" ]
publicDir = "artifacts/fiberpay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19816"
BASE_PATH = "/"
